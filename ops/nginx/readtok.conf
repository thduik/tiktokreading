server {
    server_name ieltstok.online www.ieltstok.online 34.143.183.246 _;

    root /var/www/readtok;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ieltstok.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ieltstok.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ieltstok.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ieltstok.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ieltstok.online www.ieltstok.online;
    return 301 https://ieltstok.online$request_uri;
}
