# Baseline app-layer abuse protection.
# This file is included from nginx.conf's `http` block on the VPS, so these
# shared-memory zones are intentionally defined before the `server` blocks.
# Nginx protects only simple request/connection floods here; volumetric DDoS
# still belongs at the provider/CDN layer.
limit_req_zone $binary_remote_addr zone=readtok_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=readtok_api:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=readtok_write:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=readtok_conn:10m;

server {
    server_name ieltstok.online www.ieltstok.online 103.69.97.207 _;

    root /var/www/readtok;
    index index.html;

    server_tokens off;

    client_body_timeout 10s;
    client_header_timeout 10s;
    client_max_body_size 1m;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn readtok_conn 100;
    limit_req zone=readtok_global burst=90 nodelay;

    # Mutating/auth-adjacent API routes get a tighter request budget. The
    # regular API limit still applies here so answer/report/vocab bursts remain
    # responsive without letting a single IP hammer writes endlessly.
    location ~ ^/api/(me$|me/(bootstrap|achievements/unlock-batch|submit-answer|vocab-bank)|passages/[^/]+/report|admin/(login|logout))/?$ {
        limit_conn readtok_conn 50;
        limit_req zone=readtok_api burst=45 nodelay;
        limit_req zone=readtok_write burst=12 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_conn readtok_conn 50;
        limit_req zone=readtok_api burst=45 nodelay;

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ieltstok.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ieltstok.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ieltstok.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ieltstok.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ieltstok.online www.ieltstok.online;
    return 301 https://ieltstok.online$request_uri;
}
